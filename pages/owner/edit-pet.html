    <div class="sidebar-user">
      <div class="avatar" id="user-avatar"></div>

  <!-- Main -->
  <main class="main">
    <header class="pets-head">
      <div>
        <h1>Edit pet</h1>
        <p class="pets-sub">Tell us about your pet so we can prepare for the visit.</p>
      </div>
    </header>

    <form id="pet-form" class="pf-card" novalidate>
      <div class="pf-grid">

        <div class="pf-field pf-name">
          <label for="name">Name</label>
          <input id="name" name="name" type="text" placeholder="Ex. Biscuit" maxlength="40" autocomplete="off" required />
          <p class="pf-error" id="err-name" role="alert" hidden></p>
        </div>

        <div class="pf-field pf-species">
          <label for="species">Species</label>
          <select id="species" name="species" required><option value=""></option></select>
          <p class="pf-error" id="err-species" role="alert" hidden></p>
        </div>

        <div class="pf-field pf-breed">
          <label for="breed">Breed</label>
          <select id="breed" name="breed" required><option value=""></option></select>
          <p class="pf-error" id="err-breed" role="alert" hidden></p>
        </div>

        <div class="pf-field pf-sex">
          <label for="sex">Sex</label>
          <select id="sex" name="sex" required>
            <option value=""></option>
            <option value="Male">Male</option>
            <option value="Female">Female</option>
          </select>
          <p class="pf-error" id="err-sex" role="alert" hidden></p>
        </div>

        <div class="pf-field pf-allergies">
          <label for="allergies">Allergies</label>
          <textarea id="allergies" name="allergies" placeholder="Ex. Food Allergy" maxlength="500"></textarea>
        </div>

        <div class="pf-field pf-picture">
          <span class="pf-label">Picture</span>
          <label class="pf-photo-box" for="photo">
            <span id="photo-hint">Click to upload</span>
            <img id="photo-preview" alt="Pet picture preview" hidden />
            <input id="photo" name="photo" type="file" accept="image/*" />
          </label>
          <button type="button" class="pf-photo-remove" id="photo-remove" hidden>Remove picture</button>
          <p class="pf-error" id="err-photo" role="alert" hidden></p>
        </div>

        <div class="pf-field pf-dob">
          <label for="dob">Date of Birth</label>
          <div class="pf-date">
            <input id="dob" name="dob" type="text" inputmode="numeric" placeholder="MM/DD/YYYY" maxlength="10" autocomplete="off" required />
            <button type="button" class="pf-date-btn" id="dob-btn" aria-label="Pick a date from the calendar"><svg width="26" height="26" style="width:26px;height:26px;max-width:26px;flex:none" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3.5" y="5" width="17" height="15.5" rx="2"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg></button>
            <input id="dob-picker" class="pf-date-native" type="date" tabindex="-1" aria-hidden="true" />
          </div>
          <p class="pf-error" id="err-dob" role="alert" hidden></p>
        </div>

        <div class="pf-field pf-notes">
          <label for="notes">Additional Notes</label>
          <textarea id="notes" name="notes" placeholder="Ex. Sensitive to bright lights" maxlength="500"></textarea>
        </div>

      </div>

      <div class="pf-actions">
        <a href="my-pets.html" class="pbtn pbtn-outline">Cancel</a>
        <button type="submit" class="pbtn pbtn-primary">Save Changes</button>
      </div>
    </form>
  </main>

    <script src="../../js/owner/calendar.js"></script>
   <script src="../../js/owner/pets-store.js"></script>
   <script src="../../js/owner/pet-form.js"></script>

</html>
