<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <script src="../../js/auth-guard.js" data-role="owner"></script>
  <title>My Appointments | Pawpaw Clinic</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../../css/base.css" />
  <link rel="stylesheet" href="../../css/layout.css" />
  <link rel="stylesheet" href="../../css/components.css" />
  <link rel="stylesheet" href="../../css/pages/owner/appointments.css" />
  <link rel="stylesheet" href="../../css/pages/owner/my-appointments.css" />
</head>
<body class="app">

  <!-- Mobile top bar -->
  <header class="mobile-bar">
    <button type="button" class="menu-btn" id="menu-btn" aria-label="Open menu" aria-expanded="false">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
    </button>
    <span class="mobile-title">PAWPAW Clinic</span>
  </header>
  <div class="overlay" id="overlay"></div>

  <!-- Sidebar -->
  <aside class="sidebar" id="sidebar" aria-label="Main navigation">
    <div class="sidebar-brand">
      <img src="../../assets/images/logo.svg" alt="" class="sidebar-logo" />
      <span>PAWPAW Clinic</span>
    </div>

    <nav class="nav">
      <a href="dashboard.html" class="nav-link">
        <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 3 2 11.5h2.5V21h6v-6h3v6h6v-9.5H22L12 3Z"/></svg>
        <span>Dashboard</span>
      </a>
      <a href="my-pets.html" class="nav-link">
        <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><ellipse cx="5" cy="11" rx="2.2" ry="3"/><ellipse cx="9.5" cy="6" rx="2.2" ry="3"/><ellipse cx="14.5" cy="6" rx="2.2" ry="3"/><ellipse cx="19" cy="11" rx="2.2" ry="3"/><path d="M12 11c-3 0-6 3.5-6 6 0 2 1.7 3 3.3 3 1 0 1.8-.5 2.7-.5s1.7.5 2.7.5c1.6 0 3.3-1 3.3-3 0-2.5-3-6-6-6Z"/></svg>
        <span>My Pets</span>
      </a>
      <a href="book-appointment.html" class="nav-link">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3.5" y="5" width="17" height="15.5" rx="2"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg>
        <span>Book Appointments</span>
      </a>
      <a href="my-appointments.html" class="nav-link active" aria-current="page">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
        <span>My Appointments</span>
      </a>
      <a href="medical-records.html" class="nav-link">
        <svg viewBox="0 0 24 24" fill="currentColor" fill-rule="evenodd" aria-hidden="true"><path d="M6.5 2h7.2l5.8 5.8v11.7a2.5 2.5 0 0 1-2.5 2.5h-10.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2zM8.4 11.2h7.2a.9.9 0 0 1 0 1.8H8.4a.9.9 0 0 1 0-1.8zm0 4h7.2a.9.9 0 0 1 0 1.8H8.4a.9.9 0 0 1 0-1.8zM8.4 7.2h2.7a.9.9 0 0 1 0 1.8H8.4a.9.9 0 0 1 0-1.8z"/></svg>
        <span>Medical Records</span>
      </a>
      <a href="vaccination-history.html" class="nav-link">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linejoin="round" aria-hidden="true"><path d="M12 3 4.5 6v5.5c0 4.5 3 8 7.5 9.5 4.5-1.5 7.5-5 7.5-9.5V6L12 3Z"/></svg>
        <span>Vaccination History</span>
      </a>
      <a href="services.html" class="nav-link">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linejoin="round" aria-hidden="true"><path d="M3 12V4h8l10 10-8 8L3 12Z"/><circle cx="7.5" cy="8.5" r="1.2" fill="currentColor"/></svg>
        <span>Services</span>
      </a>
      <a href="profile.html" class="nav-link">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.5 3.5-7 8-7s8 2.5 8 7"/></svg>
        <span>My Profile</span>
      </a>
    </nav>

    <div class="sidebar-user">
      <div class="avatar" id="user-avatar"></div>
      <div class="user-meta">
        <strong id="sidebar-name">User Name</strong>
        <a href="../auth/login.html" id="logout" class="logout">
          LOG OUT
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 4H5v16h4M16 8l4 4-4 4M20 12H9"/></svg>
        </a>
      </div>
    </div>
  </aside>

  <!-- Main -->
  <main class="main">
    <header class="ap-head">
      <h1>My Appointments</h1>
      <p class="ap-sub-title">Track requests and manage upcoming visits.</p>
    </header>

    <section class="ma-card" aria-label="Your appointments">
      <div class="ma-tools">
        <label class="ma-search">
          <span class="ma-sr">Search appointments</span>
          <input type="search" id="search" placeholder="Search" autocomplete="off" />
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4.5 4.5"/></svg>
        </label>
        <label class="ma-sort">
          <span class="ma-sr">Sort</span>
          <select id="sort">
            <option value="soon">Sort: Soonest first</option>
            <option value="late">Sort: Latest first</option>
            <option value="status">Sort: Status</option>
            <option value="pet">Sort: Pet name</option>
          </select>
        </label>
      </div>

      <div class="ma-table" role="table" aria-label="Appointments">
        <div class="ma-row ma-head" role="row">
          <span role="columnheader">Date and Time</span>
          <span role="columnheader">Pet and Doctor</span>
          <span role="columnheader">Services</span>
          <span role="columnheader" class="ma-c">Status</span>
          <span role="columnheader" class="ma-c">Actions</span>
        </div>
        <div id="rows"></div>
      </div>
    </section>

    <!-- Cancel confirmation -->
    <dialog id="cancel-dialog" class="ma-dialog" aria-labelledby="cancel-title">
      <h2 id="cancel-title">Cancel this appointment?</h2>
      <p id="cancel-text"></p>
      <div class="ma-dialog-actions">
        <button type="button" class="abtn abtn-outline" id="cancel-keep">Keep it</button>
        <button type="button" class="abtn abtn-danger" id="cancel-yes">Yes, cancel</button>
      </div>
    </dialog>

    <div class="ma-toast" id="toast" role="status" aria-live="polite"></div>
  </main>

  <script src="../../js/core/api.js"></script>
  <script src="../../js/owner/app-shell.js"></script>
  <script src="../../js/owner/pets-store.js"></script>
  <script src="../../js/owner/my-appointments.js"></script>
  
</body>
</html>
