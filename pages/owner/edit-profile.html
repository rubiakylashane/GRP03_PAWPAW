    <nav class="nav">

        <span>Dashboard</span>

        <span>Book Appointments</span>

      <a href="my-appointments.html" class="nav-link">

        <span>My Appointments</span>

    <div class="sidebar-user">
      <div class="avatar" id="user-avatar"></div>
      <div class="user-meta">
        <strong id="sidebar-name">User Name</strong>
        <a href="../auth/login.html" id="logout" class="logout">
          LOG OUT
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 4H5v16h4M16 8l4 4-4 4M20 12H9"/></svg>
        </a>

    </div>

  <!-- Main -->
  <main class="main">
    <header class="pets-head pr-head">
      <h1>Edit Profile</h1>
    </header>

    <form id="pr-form" class="pr-form" novalidate>
      <section class="pr-box">
        <div class="pr-grid">
          <div class="pr-field pr-name">
            <label for="name">Name</label>
            <input id="name" name="name" type="text" placeholder="Ex. Juan Dela Cruz" maxlength="80" autocomplete="name" required />
            <p class="pr-error" id="err-name" role="alert" hidden></p>
          </div>
          <div class="pr-field pr-email">
            <label for="email">Email</label>
            <input id="email" name="email" type="email" placeholder="Ex. juan@email.com" maxlength="120" autocomplete="email" />
            <p class="pr-error" id="err-email" role="alert" hidden></p>
          </div>
          <div class="pr-field pr-address">
            <label for="address">Address</label>
            <textarea id="address" name="address" placeholder="Ex. 123 Rizal St., San Pedro, Laguna" maxlength="200" autocomplete="street-address"></textarea>
          </div>
          <div class="pr-field pr-picture">
            <span class="pr-label">Picture</span>
            <label class="pr-photo-box" for="photo">
              <span id="photo-hint">Click to upload</span>
              <img id="photo-preview" alt="Profile picture preview" hidden />
              <input id="photo" name="photo" type="file" accept="image/*" />
            </label>
            <button type="button" class="pr-photo-remove" id="photo-remove" hidden>Remove picture</button>
            <p class="pr-error" id="err-photo" role="alert" hidden></p>
          </div>
          <div class="pr-field pr-phone">
            <label for="phone">Phone Number</label>
            <input id="phone" name="phone" type="tel" inputmode="tel" placeholder="Ex. 09123456789" maxlength="16" autocomplete="tel" />
            <p class="pr-error" id="err-phone" role="alert" hidden></p>
          </div>
        </div>
      </section>

      <section class="pr-box pr-pass">
        <h2>Change password</h2>
        <p class="pr-hint">Leave these empty if you do not want to change your password.</p>
        <div class="pr-pass-grid">
          <div class="pr-field">
            <label for="current">Current password</label>
            <div class="pr-pw">
              <input id="current" name="current" type="password" autocomplete="new-password" />
              <button type="button" class="pr-eye" data-for="current" aria-label="Show password" aria-pressed="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M1.5 12S5.5 5 12 5s10.5 7 10.5 7-4 7-10.5 7S1.5 12 1.5 12Z"/><circle cx="12" cy="12" r="3"/></svg></button>
            </div>
            <p class="pr-error" id="err-current" role="alert" hidden></p>
          </div>
          <div class="pr-field">
            <label for="new">New Password</label>
            <div class="pr-pw">
              <input id="new" name="new" type="password" autocomplete="new-password" />
              <button type="button" class="pr-eye" data-for="new" aria-label="Show password" aria-pressed="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M1.5 12S5.5 5 12 5s10.5 7 10.5 7-4 7-10.5 7S1.5 12 1.5 12Z"/><circle cx="12" cy="12" r="3"/></svg></button>
            </div>
            <p class="pr-error" id="err-new" role="alert" hidden></p>
          </div>
          <div class="pr-field">
            <label for="confirm">Confirm New Password</label>
            <div class="pr-pw">
              <input id="confirm" name="confirm" type="password" autocomplete="new-password" />
              <button type="button" class="pr-eye" data-for="confirm" aria-label="Show password" aria-pressed="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M1.5 12S5.5 5 12 5s10.5 7 10.5 7-4 7-10.5 7S1.5 12 1.5 12Z"/><circle cx="12" cy="12" r="3"/></svg></button>
            </div>
            <p class="pr-error" id="err-confirm" role="alert" hidden></p>
          </div>
        </div>
      </section>

      <div class="pr-actions">
        <a href="profile.html" class="pbtn pbtn-outline pr-cancel">Cancel</a>
        <button type="submit" class="pbtn pbtn-amber">Save Changes</button>
      </div>
    </form>
  </main>
